name: Build and publish Windows OTA release
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'main.js'
      - 'preload.js'
      - 'shell.html'
      - 'index.html'
      - 'package.json'
      - '.github/workflows/windows-release.yml'
permissions:
  contents: write
jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Create version tag before publishing
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $tag = "v$version"
          git fetch --tags
          if (git tag --list $tag) {
            Write-Host "Release tag $tag already exists"
          } else {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a $tag -m "87 Freight Desktop $version"
            git push origin $tag
          }
      - name: Build Windows installer and publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run build:win -- --publish always
      - name: Upload installer as workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 87-Freight-Desktop-Windows
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
          if-no-files-found: warn
