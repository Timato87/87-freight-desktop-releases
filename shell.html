<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}body{margin:0;background:#101c2c;color:#fff;font:14px Segoe UI,Arial}.bar{height:56px;display:flex;align-items:center;gap:12px;padding:8px 16px;background:#102037;border-bottom:1px solid #2e506d}.bar button{cursor:pointer;border:1px solid #426a88;background:#21466b;color:#fff;border-radius:7px;padding:9px 17px;font-weight:600}.bar button:hover{background:#32628e}.name{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}.bar{overflow:hidden}.bar button{flex-shrink:0}.hint{margin-left:auto;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex-shrink:0}.hint{margin-left:auto;color:#a6c7dd}iframe{border:0;width:100%;height:calc(100vh - 56px);display:block}</style></head><body><div class="bar"><button id="home">Home</button><button id="back">Back</button><button id="refresh">Refresh</button><span class="name" id="name">87 Freight Desktop</span><span class="hint" id="updateStatus">WE KNOW FREIGHT.</span><button id="checkUpdate">Updates</button><button id="installUpdate" style="display:none">Restart to update</button></div><iframe id="launcher" src="index.html" title="87 Freight Desktop"></iframe><script>
const frame=document.getElementById('launcher');
window.desktopHome=()=>{document.getElementById('name').textContent='87 Freight Desktop';frame.style.display='block'};
window.desktop.onState(s=>{document.getElementById('name').textContent=s.active?'87 Freight | '+s.active.toUpperCase():'87 Freight Desktop';frame.style.display=s.active?'none':'block'});
frame.addEventListener('load',()=>{const doc=frame.contentDocument;if(!doc)return;doc.addEventListener('click',e=>{const a=e.target.closest('a');if(!a)return;const u=new URL(a.href);const portals={admin:'87freight-admin.vercel.app',company:'87freight-company.vercel.app',employee:'87freight-employee.vercel.app',carrier:'87freight-carrier.vercel.app',broker:'87freight-broker.vercel.app',shipper:'87freight-shipper.vercel.app'};const name=Object.keys(portals).find(n=>portals[n]===u.hostname);if(name){e.preventDefault();window.desktop.open(name)}})});
document.getElementById('checkUpdate').onclick=()=>window.desktop.checkUpdates();
document.getElementById('installUpdate').onclick=()=>window.desktop.installUpdate();
window.desktop.onUpdate(s=>{const label={checking:'Checking for updates…',downloading:'Downloading update…',ready:'Update ready',current:'Up to date',unavailable:'Update service unavailable',development:'Development mode'};document.getElementById('updateStatus').textContent=(label[s.status]||s.status)+(s.status==='downloading'&&/^\d{1,3}%$/.test(String(s.detail||''))?' '+s.detail:'');document.getElementById('installUpdate').style.display=s.status==='ready'?'inline-block':'none'});
document.getElementById('home').onclick=()=>window.desktop.home();document.getElementById('back').onclick=()=>window.desktop.back();document.getElementById('refresh').onclick=()=>window.desktop.refresh();
</script></body></html>
